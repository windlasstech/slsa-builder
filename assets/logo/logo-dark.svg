<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title">
  <title id="logo-title">slsa-builder logo (dark background variant)</title>

  <!-- Optical fit: scale 1.12 around the artwork center (256, 298.8 local,
       measured) so the composition fills the viewBox with balanced margins -->
  <g transform="translate(256 256) scale(1.12) translate(-256 -298.8)">

    <!-- Bowl legs (tripod, logo-7 base): center leg recessed in shadow color -->
    <path stroke="#F5E9DA" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="#57514B" d="M 230 380 L 220 440 A 15 15 0 0 0 240 455 L 272 455 A 15 15 0 0 0 292 440 L 282 380 Z" />
    <path stroke="#F5E9DA" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="#756F68" d="M 120 360 L 105 430 A 15 15 0 0 0 125 450 L 155 445 A 15 15 0 0 0 165 420 L 165 370 Z" />
    <path stroke="#F5E9DA" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="#756F68" d="M 392 360 L 407 430 A 15 15 0 0 1 387 450 L 357 445 A 15 15 0 0 1 347 420 L 347 370 Z" />

    <!-- Bowl outer body (logo-7 curvature): top arc raised into a back rim so the
         stone band between rim and inner opening reads (logo-6 principle) -->
    <path stroke="#F5E9DA" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="#756F68" d="M 60 260 A 196 76 0 0 1 452 260 A 196 150 0 0 1 60 260 Z" />

    <!-- Stone shading: segmented crescent (logo-6 style, scaled to the wider bowl);
         lower arc rides the bowl outline's inner edge - no bright gap -->
    <path fill="#57514B" d="M 122 362 A 213 122 0 0 0 390 362 A 190 144 0 0 1 122 362 Z" stroke="none" />

    <!-- Vesicular pores (dark pits; two on the legs, logo-6 density) -->
    <path fill="#4B4641" d="M 88 288 c 6 -4 13 -2 15 3 c 2 6 -1 12 -6 14 c -6 2 -12 -1 -13 -6 c -1 -5 1 -9 4 -11 Z" />
    <path fill="#4B4641" d="M 212 326 c 5 -4 12 -2 14 3 c 2 5 -1 11 -6 13 c -5 2 -11 -1 -12 -6 c -1 -4 1 -8 4 -10 Z" />
    <path fill="#4B4641" d="M 303 321 c 6 -4 12 -2 14 3 c 2 6 -1 11 -6 13 c -5 2 -11 -1 -12 -6 c -1 -4 1 -8 4 -10 Z" />
    <path fill="#4B4641" d="M 409 308 c 5 -3 11 -1 13 3 c 2 5 -1 10 -6 12 c -5 2 -10 0 -11 -5 c -1 -4 1 -8 4 -10 Z" />
    <path fill="#4B4641" d="M 135 420 c 4 -3 9 -1 11 2 c 2 4 0 9 -4 10 c -4 1 -9 -1 -10 -5 c -1 -3 1 -6 3 -7 Z" />
    <path fill="#4B4641" d="M 375 420 c 4 -3 9 -1 11 2 c 2 4 0 9 -4 10 c -4 1 -9 -1 -10 -5 c -1 -3 1 -6 3 -7 Z" />

    <!-- Vesicular pores (light pits; left wall brightness via pits, not gloss) -->
    <path fill="#8C847C" d="M 95 330 c 5 -4 12 -2 14 3 c 2 5 -1 11 -6 13 c -5 2 -11 -1 -12 -6 c -1 -4 1 -8 4 -10 Z" />
    <path fill="#8C847C" d="M 124 316 c 5 -4 12 -2 14 3 c 2 5 -1 11 -6 13 c -5 2 -11 -1 -12 -6 c -1 -4 1 -8 4 -10 Z" />
    <path fill="#8C847C" d="M 148 351 c 4 -3 10 -1 12 3 c 2 4 -1 9 -5 11 c -4 2 -9 0 -11 -4 c -1 -4 1 -7 4 -10 Z" />
    <path fill="#8C847C" d="M 383 321 c 6 -4 13 -2 15 3 c 2 6 -1 12 -6 14 c -6 2 -12 -1 -13 -6 c -1 -5 1 -9 4 -11 Z" />
    <path fill="#8C847C" d="M 287 335 c 5 -3 11 -1 13 3 c 2 5 -1 10 -6 12 c -5 2 -10 0 -11 -5 c -1 -4 1 -8 4 -10 Z" />
    <path fill="#8C847C" d="M 250 372 c 5 -4 12 -2 14 3 c 2 5 -1 11 -6 13 c -5 2 -11 -1 -12 -6 c -1 -4 1 -8 4 -10 Z" />
    <path fill="#8C847C" d="M 340 364 c 5 -3 11 -1 13 3 c 2 5 -1 10 -6 12 c -5 2 -10 0 -11 -5 c -1 -4 1 -8 4 -10 Z" />

    <!-- Inner opening (logo-7 dimensions): the ring between outer silhouette and
         this smaller stroked ellipse reads as the thick rim wall -->
    <ellipse cx="256" cy="260" rx="160" ry="48" fill="#4E4842" stroke="#F5E9DA" stroke-width="12" />

    <!-- Tejolote (logo-7 form verbatim): local coords + transform, own inset shadow -->
    <g id="tejolote" transform="translate(290 200) rotate(35)">
      <!-- Main body: blunt domed handle end - cubic cap whose end tangents
           continue the side lines, so no corner where cap meets sides -->
      <path stroke="#F5E9DA" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="#756F68" d="M -26 -50 L -44 50 A 44 44 0 0 0 44 50 L 26 -50 C 24 -62, -24 -62, -26 -50 Z" />
      <path fill="#57514B" stroke="none" d="M -20 -48 L -36 40 A 36 36 0 0 0 18 60 A 44 44 0 0 1 -44 50 L -26 -50 Q 0 -58 -20 -48 Z" />
      <path fill="#4B4641" d="M -10 -20 c 3 -2 7 -1 8 2 c 1 3 -1 6 -4 7 c -3 1 -7 0 -8 -3 c 0 -2 1 -5 4 -6 Z" />
      <path fill="#8C847C" d="M -20 15 c 3 -2 7 -1 8 2 c 1 3 -1 6 -4 7 c -3 1 -7 0 -8 -3 c 0 -2 1 -5 4 -6 Z" />
    </g>

    <!-- Salsa (logo-7 verbatim): single merged base + wrap contour, climbs the
         pestle left side, crests onto the face, descends on the right -->
    <path fill="#d94a34" stroke="#F5E9DA" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" d="M 110 266 A 146 40 0 0 0 402 266 C 380 255, 323 223, 306 248 C 286 238, 240 195, 225 216 C 208 240, 160 266, 110 266 Z" />

    <!-- Ground particles worked under the head (logo-6 detail, shifted left to
         cluster at this tejolote's grinding point) -->
    <path fill="#ad3027" d="M 266 258 c 6 -4 14 -3 17 2 c -5 5 -13 5 -18 1 Z" />
    <path fill="#ad3027" d="M 290 263 c 7 -4 15 -2 18 3 c -6 5 -14 5 -19 0 Z" />
    <path fill="#ad3027" d="M 308 264 c 6 -3 13 -1 15 3 c -4 4 -12 5 -16 1 Z" />

    <!-- Half-smashed tomato near the head (logo-6 detail, moved left with the head) -->
    <path fill="#ad3027" d="M 225 262 c 10 -6 24 -4 28 4 c -6 6 -20 8 -30 2 Z" />

    <!-- Whole and half-crushed ingredients (logo-6 detail; kept >=8px inside the
         sauce outline so nothing spills onto the front inner wall) -->
    <path fill="#ad3027" d="M 156 274 c 8 -8 20 -8 25 0 l -4 11 -16 4 Z" />
    <path fill="#ad3027" d="M 238 274 c 12 -4 24 3 28 13 l -12 7 -20 -7 Z" />
    <path fill="#ad3027" d="M 342 270 c 8 -8 20 -4 25 7 l -11 11 -16 -4 Z" />
    <path fill="#3f8f4f" d="M 274 276 c 10 2 20 8 18 18 c -10 5 -20 0 -25 -10 Z" />
    <path fill="#2d6f3d" d="M 318 280 c 9 -6 19 -1.5 22 7.5 c -7.5 6 -16.5 7.5 -24 1.5 Z" />
    <path fill="#F5E9DA" d="M 296 282 c 6 -6 16 -5 20 2 l -6 10 -14 -2 Z" />
    <path fill="#F5E9DA" d="M 370 270 c 6 -5 15 -3 17 3 l -8 9 -12 -4 Z" />

    <!-- Cilantro garnish on the sauce surface (logo-6 stroked accent; fully on
         the sauce, clear of the back inner wall) -->
    <path d="M 184 280 c 4 -17 17 -27 34 -26 c -1 17 -12 29 -29 33 Z" fill="#3f8f4f" stroke="#F5E9DA" stroke-width="9" stroke-linejoin="round" />

  </g>
</svg>
