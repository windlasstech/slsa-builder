<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title">
  <title id="logo-title">slsa-builder logo draft 5 (molcajete, vesicular basalt)</title>

  <!-- Bowl: three short legs behind a deep mortar body, carved basalt -->
  <g id="bowl">
    <!-- Legs (behind body; center leg darker to read as farther) -->
    <path stroke="#3d3029" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="#756F68" d="M 136 384 L 130 436 A 12 12 0 0 0 142 448 L 162 448 A 12 12 0 0 0 174 436 L 170 384 Z" />
    <path stroke="#3d3029" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="#57514B" d="M 240 400 L 238 432 A 10 10 0 0 0 248 442 L 264 442 A 10 10 0 0 0 274 432 L 272 400 Z" />
    <path stroke="#3d3029" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="#756F68" d="M 342 384 L 338 436 A 12 12 0 0 0 350 448 L 370 448 A 12 12 0 0 0 382 436 L 376 384 Z" />

    <!-- Deep mortar body (same depth as logo.svg) -->
    <path stroke="#3d3029" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="#756F68" d="M 72 270 A 184 64 0 0 1 440 270 A 184 160 0 0 1 72 270 Z" />
    <ellipse cx="256" cy="270" rx="184" ry="64" fill="#4E4842" stroke="none" />

    <!-- Stone shading: inset crescent (no specular arc - rough stone has no gloss) -->
    <path fill="#57514B" d="M 126 375 A 200 130 0 0 0 386 375 A 178 154 0 0 1 126 375 Z" stroke="none" />

    <!-- Vesicular pores (dark pits) -->
    <path fill="#4B4641" d="M 98 300 c 6 -4 13 -2 15 3 c 2 6 -1 12 -6 14 c -6 2 -12 -1 -13 -6 c -1 -5 1 -9 4 -11 Z" />
    <path fill="#4B4641" d="M 215 340 c 5 -4 12 -2 14 3 c 2 5 -1 11 -6 13 c -5 2 -11 -1 -12 -6 c -1 -4 1 -8 4 -10 Z" />
    <path fill="#4B4641" d="M 300 335 c 6 -4 12 -2 14 3 c 2 6 -1 11 -6 13 c -5 2 -11 -1 -12 -6 c -1 -4 1 -8 4 -10 Z" />
    <path fill="#4B4641" d="M 400 320 c 5 -3 11 -1 13 3 c 2 5 -1 10 -6 12 c -5 2 -10 0 -11 -5 c -1 -4 1 -8 4 -10 Z" />
    <path fill="#4B4641" d="M 152 420 c 4 -3 9 -1 11 2 c 2 4 0 9 -4 10 c -4 1 -9 -1 -10 -5 c -1 -3 1 -6 3 -7 Z" />
    <path fill="#4B4641" d="M 358 422 c 4 -3 9 -1 11 2 c 2 4 0 9 -4 10 c -4 1 -9 -1 -10 -5 c -1 -3 1 -6 3 -7 Z" />

    <!-- Vesicular pores (light pits; left wall brightness via pits, not gloss) -->
    <path fill="#8C847C" d="M 105 345 c 5 -4 12 -2 14 3 c 2 5 -1 11 -6 13 c -5 2 -11 -1 -12 -6 c -1 -4 1 -8 4 -10 Z" />
    <path fill="#8C847C" d="M 132 330 c 5 -4 12 -2 14 3 c 2 5 -1 11 -6 13 c -5 2 -11 -1 -12 -6 c -1 -4 1 -8 4 -10 Z" />
    <path fill="#8C847C" d="M 155 368 c 4 -3 10 -1 12 3 c 2 4 -1 9 -5 11 c -4 2 -9 0 -11 -4 c -1 -4 1 -7 4 -10 Z" />
    <path fill="#8C847C" d="M 375 335 c 6 -4 13 -2 15 3 c 2 6 -1 12 -6 14 c -6 2 -12 -1 -13 -6 c -1 -5 1 -9 4 -11 Z" />
    <path fill="#8C847C" d="M 285 350 c 5 -3 11 -1 13 3 c 2 5 -1 10 -6 12 c -5 2 -10 0 -11 -5 c -1 -4 1 -8 4 -10 Z" />
    <path fill="#8C847C" d="M 255 408 c 5 -4 12 -2 14 3 c 2 5 -1 11 -6 13 c -5 2 -11 -1 -12 -6 c -1 -4 1 -8 4 -10 Z" />
    <path fill="#8C847C" d="M 330 400 c 5 -3 11 -1 13 3 c 2 5 -1 10 -6 12 c -5 2 -10 0 -11 -5 c -1 -4 1 -8 4 -10 Z" />
  </g>

  <!-- Chip -->
  <g id="chip">
    <path stroke="#3d3029" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="#f4c654" d="M 290 220 L 370 40 C 378 30, 392 32, 398 42 L 465 150 C 471 162, 465 176, 453 182 L 350 240 Z" />
    <path fill="#ffe183" d="M 295 215 L 370 45 C 375 40, 385 42, 390 48 L 380 55 L 305 215 Z" />

    <!-- Organic Toast Spots -->
    <path fill="#b8752f" d="M 370 70 c 7 -5 16 -3 19 4 c 4 8 0 16 -7 19 c -8 3 -16 -1 -18 -8 c -2 -6 1 -12 6 -15 Z" />
    <path fill="#b8752f" d="M 410 110 c 5 -4 13 -3 17 2 c 4 6 2 13 -3 17 c -6 4 -14 2 -17 -4 c -3 -5 -1 -11 3 -15 Z" />
    <path fill="#b8752f" d="M 350 120 c 9 -6 20 -7 28 -2 c 5 3 6 8 3 12 c -3 3 -7 3 -11 1 c -5 -3 -11 -2 -16 1 c -5 3 -10 2 -12 -2 c -2 -4 2 -8 8 -10 Z" />
    <path fill="#b8752f" d="M 390 150 c 7 -4 15 -2 18 3 c 3 5 1 12 -5 15 c -6 3 -13 0 -15 -5 c -2 -4 0 -10 2 -13 Z" />
  </g>

  <!-- Salsa -->
  <g id="salsa">
    <path stroke="#3d3029" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="#d94a34" d="
      M 88 270
      C 88 220, 130 180, 180 200
      C 220 160, 270 160, 310 175
      C 330 185, 340 145, 360 175
      C 380 205, 390 200, 400 200
      C 420 190, 424 230, 424 270
      A 168 48 0 0 1 88 270 Z" />

    <!-- De-uniformed Chunky tomato pieces -->
    <path fill="#ad3027" d="M 115 225 c 8 -8 20 -8 25 0 l -4 12 -16 4 Z" />
    <path fill="#ad3027" d="M 215 260 c 18 -6 36 6 42 24 l -18 12 -30 -12 Z" />
    <path fill="#ad3027" d="M 270 230 c 10 -15 30 -10 35 5 l -10 20 -25 -5 Z" />
    <path fill="#ad3027" d="M 355 275 c 8 -8 20 -4 25 8 l -12 12 -16 -4 Z" />

    <!-- De-uniformed Pepper and cilantro bits -->
    <path fill="#3f8f4f" d="M 155 190 c 10 2 20 8 18 18 c -10 5 -20 0 -25 -10 Z" />
    <path fill="#2d6f3d" d="M 235 275 c 9 -6 19 -1.5 22 7.5 c -7.5 6 -16.5 7.5 -24 1.5 Z" />
    <path fill="#3f8f4f" d="M 385 240 c 10 0 18 6 21 14 c -9 6 -21 4 -28 -4 Z" />

    <!-- Nudged warm sauce highlight -->
    <path fill="#f47a4e" d="M 130 240 c 5 15 25 30 50 35 c -20 -10 -30 -20 -35 -40 Z" />
  </g>

  <!-- Accent Garnish -->
  <g id="accents">
    <path d="M 241 199 c 4 -17 17 -27 34 -26 c -1 17 -12 29 -29 33 Z" fill="#3f8f4f" stroke="#3d3029" stroke-width="9" stroke-linejoin="round" />
  </g>
</svg>
