name: autofix.ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  autofix:
    name: Format with Prettier, golangci-lint, and shfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up mise
        uses: step-security/mise-action@a225bbd7c202ddf57dd76dff22bb7992f6314173 # v5.1.2
        with:
          install_args: "--locked"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format with Prettier
        run: pnpm exec prettier --write "**/*.{md,yml,yaml,json,jsonc}"

      - name: Format Go with golangci-lint
        if: hashFiles('**/*.go') != ''
        run: golangci-lint fmt

      - name: Format shell scripts
        # Empty input guard: xargs runs shfmt once with no files (reading an
        # empty stdin) and returns 123 when the repo tracks no *.sh files.
        run: |
          files=$(git ls-files -- "*.sh")
          if [ -n "$files" ]; then
            echo "$files" | xargs shfmt -w -i 2 -ci -bn
          fi

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
