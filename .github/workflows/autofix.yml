name: autofix.ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  autofix:
    name: Format with Prettier, golangci-lint, and shfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            autofix-api.maximilianhils.com:443
            dl.google.com:443
            github.com:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            nodejs.org:443
            proxy.golang.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: step-security/mise-action@a225bbd7c202ddf57dd76dff22bb7992f6314173 # v5.1.2
        with:
          install_args: "--locked"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format with Prettier
        run: pnpm exec prettier --write "**/*.{md,yml,yaml,json,jsonc}"

      - name: Format Go with golangci-lint
        if: hashFiles('**/*.go') != ''
        run: golangci-lint fmt

      - name: Format shell scripts
        # Empty input guard: xargs runs shfmt once with no files (reading an
        # empty stdin) and returns 123 when the repo tracks no *.sh files.
        run: |
          files=$(git ls-files -- "*.sh")
          if [ -n "$files" ]; then
            echo "$files" | xargs shfmt -w -i 2 -ci -bn
          fi

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
