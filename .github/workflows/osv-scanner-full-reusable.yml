name: OSV Scanner Full

on:
  workflow_call:
    inputs:
      scan-args:
        description: "Additional scan arguments, one per line. Do not set --format or --output."
        required: false
        type: string
        default: |-
          --recursive
          ./
      results-file-name:
        description: "SARIF results file name"
        required: false
        type: string
        default: "results.sarif"
      download-artifact:
        description: "Optional artifact name to download before scanning"
        required: false
        type: string
        default: ""
      ref:
        description: "Optional branch, tag, or commit to scan"
        required: false
        type: string
        default: ""
      upload-sarif:
        description: "Upload SARIF to code scanning when available for this repository"
        required: false
        type: boolean
        default: true
      fail-on-vuln:
        description: "Fail when vulnerabilities are found"
        required: false
        type: boolean
        default: true
      checkout-submodules:
        description: "Checkout git submodules"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scan-full:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.checkout-submodules }}
          ref: ${{ inputs.ref }}

      - name: Download custom artifact if specified
        if: ${{ inputs.download-artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: ${{ inputs.download-artifact }}
          path: ./

      - name: Run scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        continue-on-error: true
        with:
          scan-args: |-
            --output=results.json
            --format=json
            ${{ inputs.scan-args }}

      - name: Build SARIF report
        uses: google/osv-scanner-action/osv-reporter-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --output=${{ inputs.results-file-name }}
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=${{ inputs.fail-on-vuln }}

      - name: Upload SARIF to code scanning
        if: ${{ inputs.upload-sarif }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ inputs.results-file-name }}
