name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: "00 4 * * 3"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      security-events: write
      id-token: write
    uses: windlasstech/.github/.github/workflows/scorecard-reusable.yml@main
    with:
      publish-results: true
