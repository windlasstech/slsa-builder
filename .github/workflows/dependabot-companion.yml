name: Dependabot companion

on:
  workflow_run:
    workflows: [Lint]
    types: [completed]

permissions: {}

concurrency:
  group:
    dependabot-companion-${{ github.repository }}-${{ github.event.workflow_run.head_branch ||
    github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  plan:
    if:
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443 github.com:443 mise.jdx.dev:443 mise-versions.jdx.dev:443
            dl.google.com:443 release-assets.githubusercontent.com:443 proxy.golang.org:443
            sum.golang.org:443 storage.googleapis.com:443
            results-receiver.actions.githubusercontent.com:443 *.blob.core.windows.net:443
      - name: Checkout trusted main
        id: trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up trusted Go
        uses: step-security/mise-action@a225bbd7c202ddf57dd76dff22bb7992f6314173 # v5.1.2
        with:
          install_args: "--locked go"
      - name: Cache trusted base modules
        run: go mod download
      - name: Read-only plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_SHA: ${{ steps.trusted.outputs.commit }}
        run: >-
          go run -mod=readonly ./cmd/slsa-builder-internal dependabot-companion --mode plan --event
          "$GITHUB_EVENT_PATH" --trusted-root "$GITHUB_WORKSPACE" --trusted-sha "$TRUSTED_SHA"
          --output "$RUNNER_TEMP/companion-plan"
      - name: Upload data-only review plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name:
            dependabot-companion-plan-${{ github.event.workflow_run.id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/companion-plan/plan.json
            ${{ runner.temp }}/companion-plan/patch.diff
          if-no-files-found: error

  apply:
    needs: plan
    if: vars.DEPENDABOT_COMPANION_APPLY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443 github.com:443 mise.jdx.dev:443 mise-versions.jdx.dev:443
            dl.google.com:443 release-assets.githubusercontent.com:443 proxy.golang.org:443
            sum.golang.org:443 storage.googleapis.com:443
      - name: Checkout trusted main
        id: trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up trusted Go
        uses: step-security/mise-action@a225bbd7c202ddf57dd76dff22bb7992f6314173 # v5.1.2
        with:
          install_args: "--locked go"
      - name: Cache trusted base modules
        run: go mod download
      - name: Obtain scoped App installation token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DEPENDABOT_COMPANION_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_COMPANION_APP_PRIVATE_KEY }}
          owner: windlasstech
          repositories: slsa-builder
          permission-contents: write
          permission-pull-requests: read
      - name: Recompute and apply once
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          DEPENDABOT_COMPANION_APPLY_ENABLED: ${{ vars.DEPENDABOT_COMPANION_APPLY_ENABLED }}
          TRUSTED_SHA: ${{ steps.trusted.outputs.commit }}
        run: >-
          go run -mod=readonly ./cmd/slsa-builder-internal dependabot-companion --mode apply --event
          "$GITHUB_EVENT_PATH" --trusted-root "$GITHUB_WORKSPACE" --trusted-sha "$TRUSTED_SHA"
          --output "$RUNNER_TEMP/companion-apply"
