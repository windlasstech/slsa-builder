name: Lint

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: step-security/markdownlint-cli2-action@47642322847569917c6eceacb91e6c37cbd0f9fb # v24.2.0
        with:
          config: .markdownlint-cli2.jsonc
          globs: "**/*.md"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflow files
        uses: windlasstech/actionlint-hardened-action@39b1442298202b328f0da62908b70c54ab6601b9 # v1.0.0
        with:
          paths: |
            .github/workflows/*.yml
            .github/workflows/*.yaml

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            cli.codecov.io:443
            dl.google.com:443
            github.com:443
            ingest.codecov.io:443
            keybase.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            nodejs.org:443
            o26192.ingest.us.sentry.io:443
            proxy.golang.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            repo.yarnpkg.com:443
            storage.googleapis.com:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Depth 2 lets Codecov resolve the parent SHA on PR merge commits.
          fetch-depth: 2

      - name: Set up mise
        uses: step-security/mise-action@a225bbd7c202ddf57dd76dff22bb7992f6314173 # v5.1.2
        with:
          install_args: "--locked"

      - name: Run golangci-lint
        uses: step-security/golangci-lint-action@2697867e9c204558ca23d0decdd0039dc21f2b93 # v9.3.0
        with:
          version: v2.14.0

      - name: Run Go tests
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Check toolchain pin records against specifications
        run: >-
          go run ./cmd/slsa-builder-internal pin-check --publish-pin
          internal/toolchainpins/publish-npm.json --pair-record
          internal/toolchainpins/node-runtime.json --publish-spec
          docs/architecture/js-ts-npm-provenance-publish.md --build-spec
          docs/architecture/js-ts-npm-build-pack.md

      # Coverage comes from this job only: Go forbids -coverprofile with -fuzz, so the
      # fuzz-smoke matrix cannot emit a profile, and `go test ./...` already executes every
      # fuzz target's seed corpus as unit tests.
      - name: Upload results to Codecov
        uses: step-security/codecov-action@367bf7e789f1b8e452a759be81c791de8d69b2f6 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          disable_search: true
          flags: unit
          # Codecov rejects tokenless uploads from protected branches, so the upload
          # authenticates with a repository-secret token. An upload failure must not
          # break this required quality gate.
          fail_ci_if_error: false

  # Bounded fuzz smoke per docs/testing-guide.md "Fuzzing in CI"; deep runs live in fuzz.yml.
  fuzz-smoke:
    name: ${{ matrix.package }} / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: internal/canonicaljson
            target: FuzzStrictJSON
          - package: internal/attestation
            target: FuzzParseBundle
          - package: internal/attestation
            target: FuzzCompareStatement
          - package: internal/attestation
            target: FuzzValidateSignerURI
          - package: internal/policy
            target: FuzzDecodeExplicitPolicy
          - package: internal/policy
            target: FuzzDecodeReleaseManifestExpectation
          - package: internal/handoff
            target: FuzzHandoffUnmarshalJSON
          - package: internal/handoff
            target: FuzzValidateSafeBasename
          - package: internal/digest
            target: FuzzParseSHA256
          - package: internal/digest
            target: FuzzParseSHA512
          - package: internal/identity
            target: FuzzCanonicalRepository
          - package: internal/identity
            target: FuzzValidateFullSHA
          - package: internal/identity
            target: FuzzValidateReleaseRef
          - package: internal/identity
            target: FuzzValidateBuilderID
          - package: internal/identity
            target: FuzzValidateBuildTypeURI
          - package: internal/identity
            target: FuzzParseRunInvocationURI
          - package: internal/npmprofile
            target: FuzzDecodeExternalParameters
          - package: internal/npmprofile
            target: FuzzNPMPackagePURL
          - package: internal/npmprofile
            target: FuzzValidateReleaseRefEquality
          - package: internal/npmprofile
            target: FuzzValidateSourceRefInput
          - package: internal/npmprofile
            target: FuzzParseJSONWorkspacePatterns
          - package: internal/npmprofile
            target: FuzzParsePNPMWorkspacePatterns
          - package: internal/npmprofile
            target: FuzzValidateWorkspacePattern
          - package: internal/npmprofile
            target: FuzzParsePackageManager
          - package: internal/npmprofile
            target: FuzzParseDevEngines
          - package: internal/npmprofile
            target: FuzzNPMDeclaredMatchesActual
          - package: internal/npmprofile
            target: FuzzDecodePackedManifest
          - package: internal/npmprofile
            target: FuzzValidateArchivePath
          - package: internal/npmprofile
            target: FuzzDecodeRegistryPackumentResponse
          - package: internal/npmprofile
            target: FuzzDecodeRegistryAttestationResponse
          - package: internal/npmprofile
            target: FuzzNormalizeRegistryURL
          - package: internal/npmprofile
            target: FuzzDecodeGitHubOIDCResponse
          - package: internal/npmprofile
            target: FuzzDecodeNPMExchangeResponse
          - package: internal/npmprofile
            target: FuzzParseExchangeTimestamp
          - package: internal/npmprofile
            target: FuzzExtractNPMDistribution
          - package: internal/npmprofile
            target: FuzzExtractNodeRuntime
          - package: internal/workflowcheck
            target: FuzzDecodeWorkflow
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            dl.google.com:443
            github.com:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            nodejs.org:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: step-security/mise-action@a225bbd7c202ddf57dd76dff22bb7992f6314173 # v5.1.2
        with:
          install_args: "--locked"

      - name: Fuzz ${{ matrix.target }} for 30 seconds
        run: >-
          go test "./${{ matrix.package }}" -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=30s
