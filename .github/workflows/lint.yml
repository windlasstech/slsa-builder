name: Lint

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          config: .markdownlint-cli2.jsonc
          globs: "**/*.md"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Lint workflow files
        uses: windlasstech/actionlint-hardened-action@39b1442298202b328f0da62908b70c54ab6601b9 # v1.0.0
        with:
          paths: |
            .github/workflows/*.yml
            .github/workflows/*.yaml

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.6"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@db582008a42febd596419635a5abc9d9815daa9c # v9.2.1
        with:
          version: v2.12.2

      - name: Run Go tests
        run: go test ./...

  # Bounded fuzz smoke per docs/testing-guide.md "Fuzzing in CI"; deep runs live in fuzz.yml.
  fuzz-smoke:
    name: ${{ matrix.package }} / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: internal/canonicaljson
            target: FuzzStrictJSON
          - package: internal/attestation
            target: FuzzParseBundle
          - package: internal/attestation
            target: FuzzCompareStatement
          - package: internal/attestation
            target: FuzzValidateSignerURI
          - package: internal/policy
            target: FuzzDecodeExplicitPolicy
          - package: internal/policy
            target: FuzzDecodeReleaseManifestExpectation
          - package: internal/handoff
            target: FuzzHandoffUnmarshalJSON
          - package: internal/handoff
            target: FuzzValidateSafeBasename
          - package: internal/digest
            target: FuzzParseSHA256
          - package: internal/digest
            target: FuzzParseSHA512
          - package: internal/identity
            target: FuzzCanonicalRepository
          - package: internal/identity
            target: FuzzValidateFullSHA
          - package: internal/identity
            target: FuzzValidateReleaseRef
          - package: internal/identity
            target: FuzzValidateBuilderID
          - package: internal/identity
            target: FuzzValidateBuildTypeURI
          - package: internal/identity
            target: FuzzParseRunInvocationURI
          - package: internal/npmprofile
            target: FuzzDecodeExternalParameters
          - package: internal/npmprofile
            target: FuzzNPMPackagePURL
          - package: internal/npmprofile
            target: FuzzValidateReleaseRefEquality
          - package: internal/npmprofile
            target: FuzzValidateSourceRefInput
          - package: internal/npmprofile
            target: FuzzParseJSONWorkspacePatterns
          - package: internal/npmprofile
            target: FuzzParsePNPMWorkspacePatterns
          - package: internal/npmprofile
            target: FuzzValidateWorkspacePattern
          - package: internal/npmprofile
            target: FuzzParsePackageManager
          - package: internal/npmprofile
            target: FuzzParseDevEngines
          - package: internal/npmprofile
            target: FuzzDecodePackedManifest
          - package: internal/npmprofile
            target: FuzzValidateArchivePath
          - package: internal/npmprofile
            target: FuzzDecodeRegistryPackumentResponse
          - package: internal/npmprofile
            target: FuzzDecodeRegistryAttestationResponse
          - package: internal/npmprofile
            target: FuzzNormalizeRegistryURL
          - package: internal/npmprofile
            target: FuzzDecodeGitHubOIDCResponse
          - package: internal/npmprofile
            target: FuzzDecodeNPMExchangeResponse
          - package: internal/npmprofile
            target: FuzzParseExchangeTimestamp
          - package: internal/workflowcheck
            target: FuzzDecodeWorkflow
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.6"
          cache: false

      - name: Fuzz ${{ matrix.target }} for 30 seconds
        run: >-
          go test "./${{ matrix.package }}" -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=30s
