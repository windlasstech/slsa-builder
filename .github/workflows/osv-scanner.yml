name: OSV Scanner

permissions:
  contents: read

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

jobs:
  osv-scanner-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: windlasstech/.github/.github/workflows/osv-scanner-pr-reusable.yml@main
    with:
      egress-policy: block
      allowed-endpoints: >
        api.github.com:443
        api.osv.dev:443
        github.com:443
        proxy.golang.org:443
        storage.googleapis.com:443
        sum.golang.org:443

  osv-scanner-full:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: windlasstech/.github/.github/workflows/osv-scanner-full-reusable.yml@main
    with:
      egress-policy: block
      allowed-endpoints: >
        api.github.com:443
        api.osv.dev:443
        github.com:443
        proxy.golang.org:443
        storage.googleapis.com:443
        sum.golang.org:443
