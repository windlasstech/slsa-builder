name: JS/TS npm package SLSA3

permissions: {}

on:
  workflow_call:
    inputs:
      package-directory:
        description: Repository-relative directory containing the package to build
        required: true
        type: string

jobs:
  build:
    name: Build npm package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: npm-build-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: true
    outputs:
      package-name: ${{ steps.build.outputs.package-name }}
      package-version: ${{ steps.build.outputs.package-version }}
      package-purl: ${{ steps.build.outputs.package-purl }}
      package-tarball-name: ${{ steps.build.outputs.tarball-name }}
      package-tarball-sha256: ${{ steps.build.outputs.tarball-sha256 }}
      package-tarball-sha512: ${{ steps.build.outputs.tarball-sha512 }}
      tarball-artifact-name: ${{ steps.build.outputs.tarball-artifact-name }}
      build-metadata-artifact-name: ${{ steps.build.outputs.build-metadata-artifact-name }}
      build-metadata-sha256: ${{ steps.build.outputs.build-metadata-sha256 }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout package source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: source
          persist-credentials: false

      - name: Checkout trusted builder
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .slsa-builder
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Create trusted output directory
        env:
          OUTPUT_DIRECTORY: ${{ runner.temp }}/windlass-build-output
        run: mkdir --mode=0700 "$OUTPUT_DIRECTORY"

      - name: Build and pack selected package
        id: build
        working-directory: .slsa-builder
        env:
          METADATA_ARTIFACT_NAME:
            js-ts-npm-build-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          OBSERVED_REPOSITORY: ${{ github.repository }}
          OUTPUT_DIRECTORY: ${{ runner.temp }}/windlass-build-output
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
          REPOSITORY_ROOT: ${{ github.workspace }}/source
          TARBALL_ARTIFACT_NAME:
            js-ts-npm-package-tarball-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          go run ./cmd/slsa-builder-internal npm-profile-build --repository-root "$REPOSITORY_ROOT"
          --package-directory "$PACKAGE_DIRECTORY" --observed-repository "$OBSERVED_REPOSITORY"
          --output-directory "$OUTPUT_DIRECTORY" --artifact-name "$TARBALL_ARTIFACT_NAME"
          --metadata-artifact-name "$METADATA_ARTIFACT_NAME"

      - name: Upload package tarball handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: js-ts-npm-package-tarball-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.build.outputs.tarball-path }}
          if-no-files-found: error
          compression-level: 0
          overwrite: false

      - name: Upload build metadata handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: js-ts-npm-build-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.build.outputs.build-metadata-path }}
          if-no-files-found: error
          compression-level: 0
          overwrite: false
