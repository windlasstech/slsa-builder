name: Fuzz

permissions: {}

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  # Deep fuzz run per docs/testing-guide.md "Fuzzing in CI"; PR smoke lives in lint.yml.
  fuzz:
    name: ${{ matrix.package }} / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: internal/canonicaljson
            target: FuzzStrictJSON
          - package: internal/attestation
            target: FuzzParseBundle
          - package: internal/attestation
            target: FuzzCompareStatement
          - package: internal/policy
            target: FuzzDecodeExplicitPolicy
          - package: internal/policy
            target: FuzzDecodeReleaseManifestExpectation
          - package: internal/handoff
            target: FuzzHandoffUnmarshalJSON
          - package: internal/handoff
            target: FuzzValidateSafeBasename
          - package: internal/digest
            target: FuzzParseSHA256
          - package: internal/digest
            target: FuzzParseSHA512
          - package: internal/identity
            target: FuzzCanonicalRepository
          - package: internal/identity
            target: FuzzValidateFullSHA
          - package: internal/identity
            target: FuzzValidateReleaseRef
          - package: internal/identity
            target: FuzzValidateBuilderID
          - package: internal/identity
            target: FuzzValidateBuildTypeURI
          - package: internal/identity
            target: FuzzParseRunInvocationURI
          - package: internal/npmprofile
            target: FuzzDecodeExternalParameters
          - package: internal/npmprofile
            target: FuzzNPMPackagePURL
          - package: internal/npmprofile
            target: FuzzValidateReleaseRefEquality
          - package: internal/npmprofile
            target: FuzzValidateSourceRefInput
          - package: internal/npmprofile
            target: FuzzParseJSONWorkspacePatterns
          - package: internal/npmprofile
            target: FuzzParsePNPMWorkspacePatterns
          - package: internal/npmprofile
            target: FuzzValidateWorkspacePattern
          - package: internal/npmprofile
            target: FuzzParsePackageManager
          - package: internal/npmprofile
            target: FuzzParseDevEngines
          - package: internal/npmprofile
            target: FuzzDecodePackedManifest
          - package: internal/npmprofile
            target: FuzzValidateArchivePath
          - package: internal/npmprofile
            target: FuzzDecodeRegistryPackumentResponse
          - package: internal/npmprofile
            target: FuzzDecodeRegistryAttestationResponse
          - package: internal/npmprofile
            target: FuzzNormalizeRegistryURL
          - package: internal/npmprofile
            target: FuzzDecodeGitHubOIDCResponse
          - package: internal/npmprofile
            target: FuzzDecodeNPMExchangeResponse
          - package: internal/npmprofile
            target: FuzzParseExchangeTimestamp
          - package: internal/workflowcheck
            target: FuzzDecodeWorkflow
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.6"
          cache: false

      - name: Fuzz ${{ matrix.target }} for 10 minutes
        run: >-
          go test "./${{ matrix.package }}" -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=10m

      - name: Resolve fuzz corpus artifact coordinates
        id: corpus
        if: always()
        run: |
          pkg="${{ matrix.package }}"
          echo "slug=${pkg##*/}-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          echo "path=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"

      - name: Upload fuzz corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-corpus-${{ steps.corpus.outputs.slug }}
          path: ${{ steps.corpus.outputs.path }}
          if-no-files-found: warn
